name: Build FULK Android Native
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract native project
        run: unzip -q FULK_ANDROID_NATIVE.zip -d native
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: native/fulk-android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FULK-debug-apk
          path: native/fulk-android/app/build/outputs/apk/debug/app-debug.apk
